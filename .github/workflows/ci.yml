name: CI

# Runs on every pull request: the branch checks (changeset, commit authors)
# and `pnpm check` (UI conventions, build, types, tests).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Branch checks
        run: pnpm check:pr origin/${{ github.base_ref }}

      - name: Check
        run: pnpm check
