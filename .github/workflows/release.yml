name: Release

# Runs only when a commit on main adds, changes, or removes a changeset, or
# when started by hand. Ordinary commits do not start a release.
#
# - A changeset lands on main: open or update the "Version Packages" PR.
# - The "Version Packages" PR merges (it deletes the changesets): run
#   `pnpm check`, publish to npm, and create the tag and GitHub release.
#   Then build the team server image from the published version and push
#   it to ghcr.io/byronwall/exploreda as that version and `latest`.
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Open the Version Packages PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Pack the published version for the team server image
        if: steps.changesets.outputs.published == 'true'
        id: pack
        run: |
          pnpm --filter exploreda build
          pnpm --filter app build
          cd packages/explorEDA
          pnpm pack --pack-destination ../../pack
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up multi-platform builds
        if: steps.changesets.outputs.published == 'true'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        if: steps.changesets.outputs.published == 'true'

      - name: Sign in to the GitHub container registry
        if: steps.changesets.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the team server image
        if: steps.changesets.outputs.published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: pack
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/byronwall/exploreda:${{ steps.pack.outputs.version }}
            ghcr.io/byronwall/exploreda:latest
