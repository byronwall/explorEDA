name: CLI smoke

# Packs the exploreda package with its app and runs `npx exploreda` from the
# tarball on each operating system: the server starts, answers only with the
# run's key, serves the app, and every view of the sample project builds.
on:
  pull_request:
    paths:
      - "packages/explorEDA/**"
      - "apps/app/**"
      - "scripts/cli-smoke.mjs"
      - ".github/workflows/cli-smoke.yml"
  workflow_dispatch:

concurrency:
  group: cli-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build the package and its app
        run: |
          pnpm --filter exploreda build
          pnpm --filter app build

      - name: Pack
        working-directory: packages/explorEDA
        run: pnpm pack --pack-destination ../../pack

      - name: Run npx exploreda from the tarball
        timeout-minutes: 10
        run: node scripts/cli-smoke.mjs pack
