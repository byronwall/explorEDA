<line x1="8" y1="154" x2="382" y2="154" stroke="#d8dfe8"/>
<text x="26" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#667085" font-weight="600" text-anchor="start">Workspace</text>
<text x="364" y="183" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#245bd4" font-weight="600" text-anchor="end">0 → 2 rows</text>
