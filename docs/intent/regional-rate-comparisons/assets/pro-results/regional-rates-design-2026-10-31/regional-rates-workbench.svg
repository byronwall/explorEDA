<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1120" viewBox="0 0 1540 1120">
<title>Regional comparison — proposed explorEDA workbench</title>
<desc>Original conceptual light-mode design, not a running application. Synthetic regions show A with 12 events and 1200 residents, B with 8 events and 200 residents, C with zero events and 400 residents under complete collection, and D with zero observed events and 500 residents under unknown collection. Rates per 1000 residents are 10, 40, 0, and unavailable. B is selected. Its eight event keys and one exposure key are shown separately.</desc>
