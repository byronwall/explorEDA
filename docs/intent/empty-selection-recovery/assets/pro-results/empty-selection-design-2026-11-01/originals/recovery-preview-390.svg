<text x="127.39999999999999" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#667085" font-weight="600" text-anchor="start">Region</text>
<text x="235.56" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#667085" font-weight="600" text-anchor="start">Channel</text>
