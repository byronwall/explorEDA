    </style>
  </defs>
  <rect width="1280" height="1080" fill="#f3f5f8"/>
  <text x="32" y="49" font-size="29" class="strong">Read the claim. Check the exact inputs. Return.</text>
  <text x="32" y="78" font-size="15" class="muted">Design proposal · 390px reading surfaces · deterministic fixture values · not application screenshots</text>
  <text x="32" y="124" font-size="16" class="strong">01  Notebook reader</text>
  <text x="454" y="124" font-size="16" class="strong">02  Evidence excursion</text>

