name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm reads its version from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --recursive --if-present run build
        env:
          VITE_EXPLOREDA_LICENSE_KEY: ${{ vars.EXPLOREDA_SITE_LICENSE_KEY }}
          VITE_LICENSE_SERVICE_URL: ${{ vars.LICENSE_SERVICE_URL }}
          VITE_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_PRICE_COMMERCIAL: ${{ vars.PADDLE_PRICE_COMMERCIAL }}
          VITE_PADDLE_PRICE_OEM: ${{ vars.PADDLE_PRICE_OEM }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # A failing demo test stops the deploy before anything is uploaded.
      - name: Test demo
        run: pnpm --filter demo test

      # The docs browser check runs every live example's steps and writes the
      # screenshots narrow screens show into dist. Any failure stops the
      # deploy. Set DOCS_VERIFY=warn here to report without failing.
      - name: Install Chromium for the docs check
        run: pnpm --filter demo exec playwright install --with-deps chromium

      - name: Check docs in a browser
        run: pnpm --filter demo docs:verify

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
