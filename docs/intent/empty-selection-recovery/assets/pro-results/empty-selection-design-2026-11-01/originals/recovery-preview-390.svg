<text x="235.56" y="545" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d2939" font-weight="400" text-anchor="start">Web</text>
<line x1="26" y1="559" x2="364" y2="559" stroke="#d8dfe8"/>
<text x="38" y="583" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d2939" font-weight="600" text-anchor="start">B</text>
