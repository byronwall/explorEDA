  <text x="685" y="673" class="body mono" text-anchor="end">300</text>
  <text x="711" y="673" class="body">Yes</text>
  <line x1="475" y1="696" x2="823" y2="696" class="line"/>
  <rect x="475" y="697" width="348" height="55" fill="#fff8ec"/>
  <text x="486" y="719" class="body strong">O04</text>
  <text x="486" y="739" class="small muted">Source row 3</text>
  <text x="685" y="729" class="body mono muted" text-anchor="end">null</text>
  <text x="711" y="719" class="label">No</text>
  <text x="711" y="739" class="small muted">Missing</text>
  <text x="474" y="781" class="label muted">Showing 4 of 4 inputs</text>
  <text x="474" y="816" class="body">Search changes this table only.</text>
  <text x="474" y="840" class="body muted">The finding still uses the same inputs.</text>
  <text x="474" y="879" class="label accent">Open a row for all source fields</text>
  <rect x="455" y="940" width="388" height="67" fill="#f7f9fc"/>
  <line x1="455" y1="940" x2="843" y2="940" class="line"/>
  <text x="474" y="968" class="body strong">Evidence for Regions</text>
  <text x="474" y="991" class="small muted">East selection · Active = true · 12 source</text>

  <text x="882" y="178" font-size="20" class="strong">Meaning stays attached</text>
  <rect x="882" y="200" width="366" height="3" fill="#2563eb"/>
  <text x="882" y="241" class="small strong accent">01 / TWO CLAIM SCOPES</text>
  <text x="882" y="269" class="body">The author’s note names its population.</text>
  <text x="882" y="292" class="body">The live value follows Regions only.</text>
  <text x="882" y="315" class="body">Their evidence links remain distinct.</text>
  <text x="882" y="370" class="small strong accent">02 / COMPLETE INPUTS</text>
  <text x="882" y="398" class="body">Four selected orders are still four rows.</text>
  <text x="882" y="421" class="body">Three numeric values determine $200.</text>
  <text x="882" y="444" class="body">O04 remains visible with its exclusion.</text>
  <text x="882" y="499" class="small strong accent">03 / TOUCH AND KEYBOARD</text>
  <text x="882" y="527" class="body">A visible header action opens objects.</text>
  <text x="882" y="550" class="body">A prose link opens its finding directly.</text>
  <text x="882" y="573" class="body">No Inspect button is added to a mark.</text>
  <text x="882" y="628" class="small strong accent">04 / SAME ANALYTICAL STATE</text>
  <text x="882" y="656" class="body">Evidence search and paging stay local.</text>
  <text x="882" y="679" class="body">Input revisions invalidate stale records.</text>
  <text x="882" y="702" class="body">Back restores focus and reading position.</text>
  <text x="882" y="757" class="small strong accent">05 / EXISTING BUILDING BLOCKS</text>
  <text x="882" y="785" class="body">Reuse chart panels and trace plans.</text>
  <text x="882" y="808" class="body">Reuse 50-row contributor pagination.</text>
  <text x="882" y="831" class="body">Keep desktop chart rectangles unchanged.</text>
  <rect x="882" y="881" width="366" height="126" rx="6" fill="#e9eef7"/>
  <text x="898" y="907" class="small strong muted">SCHEMATIC, NOT A RENDERER TEST</text>
  <text x="898" y="935" class="body">The values are independently checked.</text>
  <text x="898" y="958" class="body">Layout, touch, keyboard, and focus still</text>
  <text x="898" y="981" class="body">require the plan’s real-browser checks.</text>
  <text x="32" y="1052" class="small muted">explorEDA narrow analytical reading · Design companion · baseline d3920a2 · 2 November 2026</text>
</svg>
