<rect x="26" y="831" width="77" height="32" rx="6" fill="white" stroke="#d8dfe8" />
<text x="64.5" y="852.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d2939" font-weight="600" text-anchor="middle">Back</text>
<rect x="113" y="831" width="251" height="32" rx="6" fill="#245bd4" stroke="#245bd4" />
<text x="238.5" y="852.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="white" font-weight="600" text-anchor="middle">Apply</text>
<text x="195.0" y="896" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#245bd4" font-weight="500" text-anchor="middle">Keep empty result</text>
<text x="16" y="963" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#667085" font-weight="600" text-anchor="start">PROPOSED DESIGN · 390 px</text>
<text x="16" y="983" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="400" text-anchor="start">One column · Actions stay reachable while content scrolls.</text>
</svg>
