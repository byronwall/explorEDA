# The explorEDA license service. Local development needs no account:
#   pnpm --filter license-service db:migrate:local
#   pnpm --filter license-service dev
# Staging and production values are set up by the For Byron doc
# (docs/intent/commercial-license/for-byron.md). Secrets are set with
# `wrangler secret put`, never in this file.
name = "exploreda-license"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
PAYMENT_PROVIDER = "fake"
PADDLE_ENV = "sandbox"
SITE_URL = "http://localhost:5291"
PUBLIC_BASE_URL = "http://localhost:8787"
MAIL_FROM = "explorEDA <licenses@exploreda.dev>"
NOTIFY_EMAIL = "sales@exploreda.dev"
SIGNING_KEY_ID = "dev-1"
TERMS_VERSION = "1.0"

[[d1_databases]]
binding = "DB"
database_name = "exploreda-licenses"
database_id = "local"
migrations_dir = "migrations"

[env.staging]
name = "exploreda-license-staging"
# Uncomment once exploreda.dev uses Cloudflare DNS; until then the service
# runs at its workers.dev address.
# routes = [{ pattern = "license-staging.exploreda.dev", custom_domain = true }]

[env.staging.vars]
PAYMENT_PROVIDER = "paddle"
PADDLE_ENV = "sandbox"
SITE_URL = "https://exploreda.dev"
PUBLIC_BASE_URL = "https://license-staging.exploreda.dev"
MAIL_FROM = "explorEDA (staging) <licenses@staging.exploreda.dev>"
NOTIFY_EMAIL = "sales@exploreda.dev"
SIGNING_KEY_ID = "dev-1"
TERMS_VERSION = "1.0"
PADDLE_PRICE_COMMERCIAL = "{{SANDBOX_PRICE_COMMERCIAL}}"
PADDLE_PRICE_OEM = "{{SANDBOX_PRICE_OEM}}"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "exploreda-licenses-staging"
database_id = "{{STAGING_DATABASE_ID}}"
migrations_dir = "migrations"

[env.production]
name = "exploreda-license"
# routes = [{ pattern = "license.exploreda.dev", custom_domain = true }]

[env.production.vars]
PAYMENT_PROVIDER = "paddle"
PADDLE_ENV = "production"
SITE_URL = "https://exploreda.dev"
PUBLIC_BASE_URL = "https://license.exploreda.dev"
MAIL_FROM = "explorEDA <licenses@exploreda.dev>"
NOTIFY_EMAIL = "sales@exploreda.dev"
SIGNING_KEY_ID = "{{PRODUCTION_KEY_ID}}"
TERMS_VERSION = "1.0"
PADDLE_PRICE_COMMERCIAL = "{{LIVE_PRICE_COMMERCIAL}}"
PADDLE_PRICE_OEM = "{{LIVE_PRICE_OEM}}"

[[env.production.d1_databases]]
binding = "DB"
database_name = "exploreda-licenses"
database_id = "{{PRODUCTION_DATABASE_ID}}"
migrations_dir = "migrations"
