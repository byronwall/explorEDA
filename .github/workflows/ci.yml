name: CI

# Runs on every pull request: the branch checks (changeset, commit authors)
# and `pnpm check` (UI conventions, build, types, tests).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step fails the PR in minutes instead of GitHub's 6-hour limit.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Branch checks
        timeout-minutes: 2
        run: pnpm check:pr origin/${{ github.base_ref }}

      - name: Check
        timeout-minutes: 20
        run: pnpm check

      # The docs browser check runs every live example's steps against the
      # demo that `pnpm check` just built, so a docs regression fails the PR
      # before it can stop a deploy.
      - name: Install Chromium for the docs check
        run: pnpm --filter demo exec playwright install --with-deps chromium

      - name: Check docs in a browser
        timeout-minutes: 15
        run: pnpm --filter demo docs:verify

  # Every database driver passes one contract suite against a real
  # database. SQLite runs in the main check; this job adds the servers.
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for this job's container only.
          POSTGRES_USER: exploreda
          POSTGRES_PASSWORD: exploreda
          POSTGRES_DB: contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exploreda -d contract"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Source contract
        timeout-minutes: 5
        env:
          EXPLOREDA_TEST_POSTGRES: postgres://exploreda:exploreda@127.0.0.1:5432/contract
        run: pnpm --filter exploreda exec vitest run src/server/sources
