      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 13px; }
      .strong { font-weight: 700; }
      .accent { fill: #1d4ed8; }
      .line { stroke: #d8dee8; stroke-width: 1; }
