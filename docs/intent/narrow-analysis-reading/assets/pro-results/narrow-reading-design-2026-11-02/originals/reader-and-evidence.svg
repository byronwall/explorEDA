  <line x1="62" y1="751" x2="391" y2="751" class="line"/>
  <text x="62" y="776" class="small muted">4 selected · 10 eligible for Regions</text>

  <text x="52" y="830" class="label muted">Source: synthetic orders, 2 November 2026.</text>
  <text x="52" y="852" class="label muted">One row per order. Revenue in USD.</text>
  <text x="52" y="874" class="label muted">O04 has missing revenue; O08 is invalid.</text>
  <text x="52" y="910" class="body accent">Web − Store average: $0.00 · Records</text>
  <rect x="33" y="940" width="388" height="67" rx="0" fill="#f7f9fc"/>
  <line x1="33" y1="940" x2="421" y2="940" class="line"/>
