<circle cx="44" cy="258.0" r="3.5" fill="#245bd4"/>
<text x="62" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#667085" font-weight="600" text-anchor="start">Region comparison</text>
<text x="62" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d2939" font-weight="600" text-anchor="start">Region: East</text>
<text x="350" y="263.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#245bd4" font-weight="600" text-anchor="end">2 rows</text>
