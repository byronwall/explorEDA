<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-label="Proposed narrow notebook reader and exact-record evidence view. East selects four of ten active orders. Three revenue values total 600 and average 200; O04 is excluded because revenue is missing.">
