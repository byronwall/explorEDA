# Databases for the source contract tests. Start them with
#   docker compose -f docker/test-databases.yaml up -d --wait
# then run the tests with the addresses below, as CI does:
#   EXPLOREDA_TEST_POSTGRES=postgres://exploreda:exploreda@127.0.0.1:55432/contract \
#   EXPLOREDA_TEST_MYSQL=mysql://exploreda:exploreda@127.0.0.1:53306/contract \
#   EXPLOREDA_TEST_SQLSERVER='sqlserver://sa:Exploreda-test-1@127.0.0.1:51433/master' \
#     pnpm --filter exploreda exec vitest run src/server/sources
# SQL Server's image is for x86-64; on Apple silicon it runs under Docker's
# Rosetta emulation.
# The passwords here are throwaway test values for these containers only.
name: exploreda-test-databases
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exploreda
      POSTGRES_PASSWORD: exploreda
      POSTGRES_DB: contract
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exploreda -d contract"]
      interval: 2s
      timeout: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: exploreda
      MYSQL_USER: exploreda
      MYSQL_PASSWORD: exploreda
      MYSQL_DATABASE: contract
    ports:
      - "53306:3306"
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uexploreda -pexploreda"]
      interval: 2s
      timeout: 2s
      retries: 60
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Exploreda-test-1
    ports:
      - "51433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Exploreda-test-1 -Q 'select 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
