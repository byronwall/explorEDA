<text x="26" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d2939" font-weight="600" text-anchor="start">Preview · Remove Region: East</text>
<text x="26" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#667085" font-weight="600" text-anchor="start">Keep</text>
