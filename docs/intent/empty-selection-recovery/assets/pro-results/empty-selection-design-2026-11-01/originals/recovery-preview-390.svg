<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" role="img" aria-label="Proposed empty-selection recovery interface at 390 pixels">
<desc>Static design proposal. Workspace has zero of four rows. Removing the East selection from Region comparison would return records A and B while preserving the Workspace West restriction. Apply is explicit.</desc>
