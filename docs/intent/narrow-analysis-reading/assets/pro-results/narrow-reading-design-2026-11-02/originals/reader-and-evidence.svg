  <text x="64" y="318" class="body">East accounts for 4 of 10 active orders</text>
  <text x="64" y="342" class="body">(40%). <tspan fill="#1d4ed8">Show the claim’s records</tspan></text>

  <text x="52" y="390" font-size="17" class="strong">4 of 10 active orders selected</text>
  <text x="52" y="419" font-size="18">Average revenue <tspan class="strong">$200.00</tspan></text>
  <text x="52" y="443" class="body muted">3 valid values · 1 excluded input</text>
